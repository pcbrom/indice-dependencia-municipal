# nginx do container idm. Serve o SPA estatico (Vite build).
# O nginx do HOST faz o reverse proxy de idm.pcbrom.com para este container.

server {
    # Container roda como usuario non-root (nginxinc/nginx-unprivileged); por
    # isso a porta e 8080 internamente. O host mapeia 127.0.0.1:3006 -> 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compressao de texto (os artefatos JSON de dados sao grandes).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/javascript application/json
        application/geo+json application/xml image/svg+xml font/woff2;

    # Cabecalhos de seguranca em todas as respostas. A CSP permite o que o
    # painel usa: workers de blob do MapLibre GL, estilos inline do React e do
    # Observable Plot, imagens data:, e fetch same-origin dos artefatos JSON.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src blob:; child-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Assets versionados (hash no nome): cache longo e imutavel.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA: qualquer rota nao correspondente a um arquivo cai no index.html, para
    # o roteamento client-side do React Router funcionar em deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
